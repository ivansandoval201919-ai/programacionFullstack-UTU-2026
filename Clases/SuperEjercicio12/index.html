<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mi colección favorita</title>
</head>
<body>
    <img src="Images/5091450.jpg">
        <div class="content">
                 <h1 class="title">Mi colección favorita</h1>
<br>
<br>
                <p>Esta pagina web permite gestiona/crear una coleccion segun tus intereses. </p>
                <br>

       
<div class="div">       
    <div class="text-content">
            <div class="labels">

        </div>
        
        </div>

        <div class="inputs">
            <label for="nombre" >Nombre: </label> 
            <input type="text" id="name" class="input">

            <label for="desc">Descripción breve: </label> 
            <span class="error-message" id="error-task">No se aceptan valores vacios</span>
            <textarea placeholder="De qué trata..." id="description"></textarea>

            <label for="tipo">Tipo: </label>
            <label for="tipo"></label>
             <select id="kind">
            <option value="">Seleccionar...</option>
            <option value="Videojuego">Videojuego</option>
            <option value="Película">Película</option>
            <option value="Serie">Serie</option>
        </select>
            
            <label for="estado">Estado: </label>

        <label for="estado"></label>
        <select id="state">
            <option value="">Seleccionar</option>
            <option value="Pendiente">Pendiente</option>
            <option value="En progreso">En progreso</option>
            <option value="Viendo">Viendo</option>
                <option value="Jugando">Jugando</option>
            
            <option value="Completado">Completado</option>
        </select>
        
        <label for="img">URL: </label>
         <input id="img" type="url">
        <span class="error-message" id="error-img">No se aceptan valores vacios</span>
        <button type="submit" class="btn-gradient">Agregar</button>
        <br>

        <p>Elementos agregados: <span id="total-count">0</span></p>
    
        </div>
    </div>
