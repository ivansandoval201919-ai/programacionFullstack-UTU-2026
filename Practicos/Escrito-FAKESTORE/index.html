<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

    
    <header> <nav> </nav> </header>

<!-- nicolas negretto -->
<section id="login">
    <h2>Iniciar sesion</h2>
    <form id="loginForm">
        <div class="campo-formulario">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" placeholder="johnd" autocomplete="username" required>
        </div>

        <div class="campo-formulario">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="m38rmF$" autocomplete="current-password" required>
        </div>

        <button type="submit" id="btnLogin">Ingresar</button>
        <p id="loginError" class="mensaje-error hidden"></p>
    </form>
</section>

<section id="perfil" class="hidden">
    <h2>Mi perfil</h2>
    <div id="perfilInfo" class="perfil-card">
        <p><span class="badge-sesion">Sesion activa</span></p>
        <p><strong>Nombre:</strong> <span id="perfilNombre"></span></p>
        <p><strong>Usuario:</strong> <span id="perfilUsuario"></span></p>
        <p><strong>Email:</strong> <span id="perfilEmail"></span></p>
        <p><strong>Telefono:</strong> <span id="perfilTelefono"></span></p>
        <button id="btnLogout">Cerrar sesion</button>
    </div>
</section>
<!-- Nicolas Negretto Fin -->
       
    <!-- Augusto Fernandez -->
      <main id="catalogo" class="hidden">
      <aside id="filtros">
            <h2>Filtros</h2>
            <label for="selectCategoria">Categoría</label>
            <select id="selectCategoria">
               
            </select>
            <label for="inputBuscador">Buscar</label>
            <input type="text" id="inputBuscador" placeholder="Buscar producto">
       </aside>

       <section id="contenedor-productos">
            <p id="msgResultado"></p>
            <div id="gridProductos">
               
            </div>
        </section>
      </main>
       <!-- Augusto Fernandez Fin -->

    
    <footer></footer>
      <script src="script.js" defer></script>
</body>
</html>
