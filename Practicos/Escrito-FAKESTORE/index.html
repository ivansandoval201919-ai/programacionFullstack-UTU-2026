<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <title>Document</title>
</head>
<body>

    
    <header> <nav> </nav> </header>

<!-- nicolas negretto -->
<section id="login">
        <h2>Sign in</h2>

    <form id="loginForm">
        <div class="campo-formulario">
            <label for="username">User</label>
            <input type="text" id="username" name="username" placeholder="johnd" autocomplete="username" required>
        </div>

        <div class="campo-formulario">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="m38rmF$" autocomplete="current-password" required>
        </div>

        <button type="submit" id="btnLogin">Log in</button>
        <p id="loginError" class="mensaje-error hidden"></p>
    </form>
</section>

<section id="perfil" class="hidden">
    <h2>Mi perfil</h2>
    <div id="perfilInfo" class="perfil-card">
        <p><span class="badge-sesion">Sesion activa</span></p>
        <p><strong>Name:</strong> <span id="perfilNombre"></span></p>
        <p><strong>User:</strong> <span id="perfilUsuario"></span></p>
        <p><strong>Gmail:</strong> <span id="perfilEmail"></span></p>
        <p><strong>Number:</strong> <span id="perfilTelefono"></span></p>
        <button id="btnLogout">Cerrar sesion</button>
    </div>
</section>
<!-- Nicolas Negretto Fin -->
       
    <!-- Augusto Fernandez -->
      <main id="catalogo">
      <aside id="filtros">
            <h2>Filter</h2>
            <label for="selectCategoria">Category</label>
            <select id="selectCategoria">
               
            </select>
            <label for="inputBuscador">Search</label>
            <input type="text" id="inputBuscador" placeholder="Search...">
       </aside>

       <section id="contenedor-productos">
            <p id="msgResultado"></p>
            <div id="gridProductos">
               
            </div>
        </section>
               <!-- Augusto Fernandez Fin -->

       <!-- Ivan Sandoval -->

<aside id="carrito">
        <h2>My cart</h2>
        <div id="carrito-items">
</div>
        
        <div class="carrito-total-container">
        <h3>Total: $<span id="carrito-total">0.00</span></h3>

</div>
</aside>
       <!-- Ivan Sandoval Fin -->

      </main>
        

    
    <footer></footer>
      <script src="script.js" defer></script>
</body>
</html>
